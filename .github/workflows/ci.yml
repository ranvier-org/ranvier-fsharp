name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  fork:
    name: Build FCS fork (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout ranvier-fsharp
        uses: actions/checkout@v7
        with:
          path: ranvier-fsharp
          persist-credentials: false

      - name: Checkout fickle-fsharp (FCS fork)
        uses: actions/checkout@v7
        with:
          repository: shayanhabibi/fickle-fsharp
          ref: fickle_decl
          path: fickle-fsharp
          persist-credentials: false

      - name: Setup .NET 10 & 11 SDKs
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ranvier-fsharp/global.json
          dotnet-version: 11.0.x

      - name: Cache NuGet packages (fork)
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-fork-${{ runner.os }}-${{ hashFiles('fickle-fsharp/eng/Versions.props', 'fickle-fsharp/src/Compiler/FSharp.Compiler.Service.fsproj') }}
          restore-keys: nuget-fork-${{ runner.os }}-

      - name: Build FCS fork
        shell: pwsh
        working-directory: ranvier-fsharp
        run: ./build/fork.ps1 -ForkDir ../fickle-fsharp

      - name: Upload built FCS fork assemblies
        uses: actions/upload-artifact@v7
        with:
          name: fickle-fcs-net10
          path: |
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.Compiler.Service.dll
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.Compiler.Service.xml
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.DependencyManager.Nuget.dll
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.DependencyManager.Nuget.xml
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.Core.dll
            fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0/FSharp.Core.xml
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.suite }})
    needs: fork
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - fast
          - decl
          - checker
          - checker-fuzz-1
          - checker-fuzz-2
          - checker-fuzz-3
          - checker-fuzz-4
          - checker-fuzz-5
          - checker-fuzz-6
          - server
          - agent
    steps:
      - name: Checkout ranvier-fsharp
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download FCS fork assemblies
        uses: actions/download-artifact@v8
        with:
          name: fickle-fcs-net10
          path: .fcs/net10.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build solution (Release)
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet build RanvierFSharp.slnx -c Release "-p:FickleFcsDir=$fcs"

      - name: Run fast suites (Lsp, Harness, Checkpoint)
        if: matrix.suite == 'fast'
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Lsp.Tests/Rfs.Lsp.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rfs.Harness.Tests/Rfs.Harness.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rfs.Checkpoint.Tests/Rfs.Checkpoint.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Decl suite
        if: matrix.suite == 'decl'
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Decl.Tests/Rfs.Decl.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"

      - name: Run Checker suite (deterministic)
        if: matrix.suite == 'checker'
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Checker.Tests/Rfs.Checker.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs" -- --no-fuzz

      - name: Run Checker fuzz shard
        if: startsWith(matrix.suite, 'checker-fuzz-')
        shell: pwsh
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          $shard = $env:SUITE.Substring('checker-fuzz-'.Length)
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Checker.Tests/Rfs.Checker.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs" -- --fuzz-shard "$shard/6"

      - name: Run Server suite
        if: matrix.suite == 'server'
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Server.Tests/Rfs.Server.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"

      - name: Run Agent suite (CLI, MCP, Daemon & Reaper)
        if: matrix.suite == 'agent'
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '/'
          dotnet run --project tests/Rfs.Agent.Tests/Rfs.Agent.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"

  windows:
    name: Windows Build & Tool Smoke
    needs: fork
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout ranvier-fsharp
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download FCS fork assemblies
        uses: actions/download-artifact@v8
        with:
          name: fickle-fcs-net10
          path: .fcs/net10.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build solution & run Lifecycle, Lsp, and Agent tests
        shell: pwsh
        run: |
          $fcs = [System.IO.Path]::GetFullPath('.fcs/net10.0') + '\'
          dotnet build RanvierFSharp.slnx -c Release "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rfs.Lsp.Tests/Rfs.Lsp.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rfs.Agent.Tests/Rfs.Agent.Tests.fsproj -c Release --no-build "-p:FickleFcsDir=$fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\Rfs.Server.Tests\bin\Release\net10.0\Rfs.Server.Tests.exe --filter-test-list Lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packages:
    name: Packages
    needs: fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ranvier-fsharp
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download FCS fork assemblies
        uses: actions/download-artifact@v8
        with:
          name: fickle-fcs-net10
          path: ../fickle-fsharp/artifacts/bin/FSharp.Compiler.Service/Release/net10.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack all NuGet packages and distribution bundles
        shell: pwsh
        run: |
          ./build/pack.ps1 -Configuration Release -ForkDir ../fickle-fsharp -Runtimes @('win-x64', 'linux-x64', 'osx-arm64')
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/ranvierautocomplete-portable-net10.0.zip -Force
          Compress-Archive -Path ./artifacts/publish-rfs/* -DestinationPath ./artifacts/rfs-portable-net10.0.zip -Force
          foreach ($rid in 'win-x64', 'linux-x64', 'osx-arm64') {
            Compress-Archive -Path "./artifacts/publish-$rid/*" -DestinationPath "./artifacts/ranvierautocomplete-$rid-net10.0.zip" -Force
            Compress-Archive -Path "./artifacts/publish-rfs-$rid/*" -DestinationPath "./artifacts/rfs-$rid-net10.0.zip" -Force
          }

      - name: Verify all 8 NuGet packages & isolated consumer smoke tests
        shell: pwsh
        run: ./build/verify-packages.ps1 -NupkgDir ./artifacts/nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload standalone release bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: artifacts/*.zip
          if-no-files-found: error

  result:
    name: CI result
    needs: [fork, tests, windows, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success) ;; *) exit 1 ;; esac
          done
