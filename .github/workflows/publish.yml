# NuGet.org's Trusted Publishing policy targets `ranvier-org/ranvier-fsharp`, workflow `publish.yml`, and owner `shayan.habibi`.
# Do not rename this file without updating the NuGet.org policy.
name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate OIDC login and package artifacts without pushing to NuGet.org'
        type: boolean
        default: true
      version:
        description: 'Optional package version override when packing on tag/dispatch (defaults to Directory.Build.props / tag)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore: release '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout ranvier-fsharp
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: ranvier-fsharp
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ranvier-fsharp/global.json

      - name: Download artifacts from CI workflow_run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ranvier-fsharp/artifacts/nupkg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout fickle-fsharp (for tag or manual dispatch build)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v7
        with:
          repository: shayanhabibi/fickle-fsharp
          ref: fickle_decl
          path: fickle-fsharp
          persist-credentials: false

      - name: Setup .NET 11 SDK for FCS fork build
        if: github.event_name != 'workflow_run'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build FCS fork & pack release artifacts
        if: github.event_name != 'workflow_run'
        shell: pwsh
        working-directory: ranvier-fsharp
        run: |
          $ver = '${{ inputs.version }}'
          if (-not $ver -and '${{ github.ref_type }}' -eq 'tag') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          ./build/fork.ps1 -ForkDir ../fickle-fsharp
          ./build/pack.ps1 -Configuration Release -ForkDir ../fickle-fsharp -Version $ver -Runtimes @('win-x64', 'linux-x64', 'osx-arm64')
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/ranvierautocomplete-portable-net10.0.zip -Force
          foreach ($rid in 'win-x64', 'linux-x64', 'osx-arm64') {
            Compress-Archive -Path "./artifacts/publish-$rid/*" -DestinationPath "./artifacts/ranvierautocomplete-$rid-net10.0.zip" -Force
          }

      - name: Verify all 7 NuGet packages & isolated consumer smoke tests
        shell: pwsh
        working-directory: ranvier-fsharp
        run: |
          $ver = '${{ inputs.version }}'
          if (-not $ver -and '${{ github.ref_type }}' -eq 'tag') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($ver) {
            ./build/verify-packages.ps1 -NupkgDir ./artifacts/nupkg -Version $ver
          } else {
            ./build/verify-packages.ps1 -NupkgDir ./artifacts/nupkg
          }

      - name: Authenticate to NuGet with Trusted Publishing (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'shayan.habibi' }}

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        shell: pwsh
        working-directory: ranvier-fsharp
        run: |
          Write-Host "NuGet Trusted Publishing OIDC login succeeded for shayan.habibi! Skipping push because dry_run=true."
          Get-ChildItem ./artifacts/nupkg/*.nupkg | Sort-Object Name | ForEach-Object { Write-Host "Would push: $($_.Name)" }

      - name: Publish packages to NuGet.org in dependency order
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: pwsh
        working-directory: ranvier-fsharp
        run: |
          $orderedIds = @(
            'Ranvier.FSharp.Lsp',
            'Ranvier.FSharp.Projects',
            'Ranvier.FSharp.Checker',
            'Ranvier.FSharp.Checker.Traced',
            'Ranvier.FSharp.Server',
            'Ranvier.FSharp.Server.Traced',
            'Ranvier.AutoComplete'
          )
          $allNupkgs = @(Get-ChildItem ./artifacts/nupkg/*.nupkg)
          if ($allNupkgs.Count -ne $orderedIds.Count) {
            throw "Expected $($orderedIds.Count) .nupkg files in ./artifacts/nupkg, found $($allNupkgs.Count)"
          }
          foreach ($id in $orderedIds) {
            $pkg = $allNupkgs | Where-Object { $_.Name -match "^$([regex]::Escape($id))\.\d" } | Select-Object -First 1
            if (-not $pkg) { throw "Missing expected package for $id in ./artifacts/nupkg" }
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($pkg.Name) with exit code $LASTEXITCODE" }
          }

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        working-directory: ranvier-fsharp
        run: |
          gh release create '${{ github.ref_name }}' `
            ./artifacts/nupkg/*.nupkg `
            ./artifacts/*.zip `
            --generate-notes `
            --title '${{ github.ref_name }}'
